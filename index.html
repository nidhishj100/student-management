<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System | Tech Titans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Management System</h1>
            <p>🚀 Tech Titans Hackathon Project (Linear Data Structure Framework)</p>
        </header>

        <div class="dashboard-stats">
            <div class="stat-card">
                <h3>Total Enrolled Records</h3>
                <span id="totalCount">0</span>
            </div>
        </div>

        <div class="card form-card">
            <h2>➕ Add New Student Record</h2>
            <form id="studentForm">
                <input type="number" id="studentId" placeholder="Student ID (e.g., 101)" required>
                <input type="text" id="studentName" placeholder="Full Name" required>
                <input type="text" id="studentDept" placeholder="Department (e.g., CSE)" required>
                <input type="number" id="studentMarks" placeholder="Academic Marks (%)" step="0.01" min="0" max="100" required>
                <button type="submit" class="btn-primary">Insert Record into Memory (ArrayList)</button>
            </form>
        </div>

        <div class="card list-card">
            <div class="list-header">
                <h2>📋 Active Student Database</h2>
                <button onclick="clearSystem()" class="btn-danger">Clear All Records</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Marks</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <!-- Dynamic rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
